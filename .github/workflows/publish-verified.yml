name: Publish verified 2.1.0 artifact
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-verified.yml']
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b4118833b038e507863e32009078b2d768ad9471
          persist-credentials: false
      - name: Verify the completed build belongs to this exact source
        run: |
          gh api repos/xiaohei07/DeepSeek-Export-Plus/actions/runs/39953209624 > verified-run.json
          python3 - <<'PY'
          import json
          run = json.load(open('verified-run.json'))
          assert run['head_sha'] == 'b4118833b038e507863e32009078b2d768ad9471'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          PY
      - name: Download the installation artifact that passed all tests
        run: |
          gh run download 39953209624 --name DeepSeek-Export-Plus --dir release-download
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('release-download/DeepSeek-Export-Plus-2.1.0.zip') as z:
              assert z.testzip() is None
              assert json.loads(z.read('manifest.json'))['version'] == '2.1.0'
              assert len(z.namelist()) == 44
          PY
      - name: Publish the verified installation ZIP
        run: |
          if ! gh release view v2.1.0 >/dev/null 2>&1; then
            gh release create v2.1.0 release-download/DeepSeek-Export-Plus-2.1.0.zip --target b4118833b038e507863e32009078b2d768ad9471 --title "DeepSeek Export Plus v2.1.0" --notes-file docs/RELEASE-NOTES.md
          fi
          gh run cancel 39953209787 || true
